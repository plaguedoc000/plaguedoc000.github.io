<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Расписание · Калужский филиал РАНХиГС</title>
<meta name="theme-color" content="#0B0D10">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: #0B0D10;
    --bg-raised: #1A1D22;
    --ink: #FAFBFA;
    --ink-soft: #C6CCD3;
    --hairline: #454B54;
    --gold: #C49A4A;
    --gold-soft: #302514;
    --maroon: #C49A4A;
    --maroon-soft: #302514;
    --live: #C49A4A;
    --live-soft: #302514;
    --radius: 10px;
    --font-display: Georgia, 'Times New Roman', 'PT Serif', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    background:var(--bg);
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  @media (min-width:521px){
    .app{ box-shadow:0 0 0 1px var(--hairline); min-height:calc(100vh - 32px); margin:16px 0; border-radius:16px;}
  }

  /* header */
  .hdr{ display:flex; flex-direction:column; gap:2px; }
  .hdr .eyebrow{ font-size:13px; color:var(--ink-soft); letter-spacing:.01em; font-weight:600; }
  .hdr h1{ font-family:var(--font-display); font-weight:700; font-size:25px; margin:0; line-height:1.2;}
  .hdr .clock{ font-size:14px; color:var(--ink-soft); font-variant-numeric: tabular-nums; margin-top:2px;}
  .hdr .clock b{ color:var(--ink); font-weight:700; }

  /* group tabs */
  .groups{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{
    border:1.5px solid var(--hairline);
    background:var(--bg-raised);
    color:var(--ink);
    padding:9px 14px;
    border-radius:999px;
    font-size:14.5px;
    font-weight:700;
    font-family:var(--font-body);
    cursor:pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .pill.active{ background:var(--maroon); border-color:var(--maroon); color:#0B0D10; }

  /* day tabs */
  .days{
    display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;
    scrollbar-width:none;
  }
  .days::-webkit-scrollbar{ display:none; }
  .day{
    flex:0 0 auto;
    min-width:56px;
    text-align:center;
    padding:8px 10px;
    border-radius:var(--radius);
    border:1px solid transparent;
    cursor:pointer;
    background:transparent;
  }
  .day .wd{ font-size:12.5px; color:var(--ink-soft); text-transform:none; font-weight:600; }
  .day .dt{ font-size:16px; font-weight:700; margin-top:2px; }
  .day.today .wd{ color:var(--gold); font-weight:700; }
  .day.active{ background:var(--bg-raised); border-color:var(--ink-soft); }
  .day .dot{ width:4px; height:4px; border-radius:50%; background:var(--gold); margin:4px auto 0; visibility:hidden; }
  .day.today .dot{ visibility:visible; }

  hr.rule{ border:none; border-top:1px solid var(--hairline); margin:0; }

  /* status banner */
  #content{ display:flex; flex-direction:column; gap:10px; }
  .status{
    border-radius:var(--radius);
    padding:14px 16px;
    display:flex; flex-direction:column; gap:6px;
    border:1px solid var(--hairline);
    background:var(--bg-raised);
  }
  .status.live{ background:var(--live-soft); border-color:var(--live); border-width:1.5px; }
  .status.next{ background:var(--gold-soft); border-color:var(--gold); border-width:1.5px; }
  .status .tag{ font-size:12.5px; font-weight:800; letter-spacing:.02em; }
  .status.live .tag{ color:var(--live); }
  .status.next .tag{ color:var(--gold); }
  .status .subj{ font-family:var(--font-display); font-size:18px; line-height:1.32; font-weight:700; }
  .status .meta{ font-size:13.5px; color:var(--ink-soft); }
  .bar{ height:5px; border-radius:3px; background:rgba(255,255,255,.12); overflow:hidden; margin-top:2px;}
  .bar > i{ display:block; height:100%; background:var(--live); }

  /* notice (vacation / knowledge day / self-study) */
  .notice{
    border:1.5px dashed var(--hairline);
    border-radius:var(--radius);
    padding:22px 16px;
    text-align:center;
    color:var(--ink-soft);
  }
  .notice .big{ font-family:var(--font-display); font-size:20px; font-weight:700; color:var(--ink); margin-bottom:4px; }
  .notice .sub{ font-size:14px; }

  /* timeline */
  .timeline{ display:flex; flex-direction:column; gap:10px; }
  .lesson{
    display:grid;
    grid-template-columns:34px 1fr;
    gap:12px;
    padding:13px 14px;
    border:1px solid var(--hairline);
    border-radius:var(--radius);
    background:var(--bg-raised);
  }
  .lesson.current{ border-color:var(--live); }
  .lesson .num{
    font-family:var(--font-display);
    font-size:16px;
    font-weight:700;
    color:var(--ink-soft);
    padding-top:2px;
    text-align:center;
  }
  .lesson.current .num{ color:var(--live); }
  .lesson .body{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .lesson .time{ font-size:13px; color:var(--ink-soft); font-weight:600; font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:6px;}
  .lesson .time .badge{ font-size:10.5px; font-weight:800; padding:1px 6px; border-radius:999px; letter-spacing:.02em; }
  .lesson.current .time .badge{ background:var(--live); color:#0B0D10; }
  .lesson .subj{ font-size:16px; font-weight:600; line-height:1.4; }
  .lesson.past{ opacity:.65; }
  .lesson .info{ font-size:13.5px; color:var(--ink-soft); }
  .lesson .shared{ font-size:12px; color:var(--gold); font-weight:600; }

  .empty-note{ font-size:13.5px; color:var(--ink-soft); padding:14px 0; }
</style>
</head>

  // ---------- Telegram integration ----------

        tg.setBackgroundColor("#0B0D10");
      }catch(e){}
    }
  }
  function haptic(){ if (tg && tg.HapticFeedback) { try{ tg.HapticFeedback.selectionChanged(); }catch(e){} } }

  function saveGroup(g){
    if (tg && tg.CloudStorage){
      try{ tg.CloudStorage.setItem("selected_group", g, function(){}); }catch(e){}
    }
  }
  function loadGroupThenInit(){
    if (tg && tg.CloudStorage){
      try{
        tg.CloudStorage.getItem("selected_group", function(err, val){
          if (!err && val && GROUPS.indexOf(val) !== -1) state.group = val;
          init();
        });
        return;
      }catch(e){}
    }
    init();
  }

  // ---------- time helpers (Europe/Moscow) ----------
  function nowMoscow(){
    var fmt = new Intl.DateTimeFormat("en-CA", {
      timeZone:"Europe/Moscow", year:"numeric", month:"2-digit", day:"2-digit",
      hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false
    });
    var map = {};
    fmt.formatToParts(new Date()).forEach(function(p){ map[p.type] = p.value; });
    var mins = (+map.hour) * 60 + (+map.minute);
    return { dateKey: map.year+"-"+map.month+"-"+map.day, hh:+map.hour, mm:+map.minute, ss:+map.second, mins: mins };
  }
  function toMinutes(hhmm){
    var parts = hhmm.split(":");
    return (+parts[0]) * 60 + (+parts[1]);
  }
  function pad(n){ return n < 10 ? "0"+n : ""+n; }

  // ---------- rendering ----------
  var groupTabsEl = document.getElementById("groupTabs");
  var dayTabsEl = document.getElementById("dayTabs");
  var contentEl = document.getElementById("content");
  var clockEl = document.getElementById("clockNow");

  function weekdayShortRu(dateKey){
    var d = SCHEDULE.filter(function(x){ return x.date === dateKey; })[0];
    return d ? d.weekday : "";
  }

  function renderGroupTabs(){
    groupTabsEl.innerHTML = "";
    GROUPS.forEach(function(g){
      var btn = document.createElement("button");
      btn.className = "pill" + (g === state.group ? " active" : "");
      btn.textContent = g;
      btn.addEventListener("click", function(){
        if (state.group === g) return;
        state.group = g;
        saveGroup(g);
        haptic();
        renderGroupTabs();
        renderContent();
      });
      groupTabsEl.appendChild(btn);
    });
  }

  function renderDayTabs(){
    var todayKey = nowMoscow().dateKey;
    dayTabsEl.innerHTML = "";
    SCHEDULE.forEach(function(d){
      var el = document.createElement("div");
      el.className = "day" + (d.date === state.date ? " active" : "") + (d.date === todayKey ? " today" : "");
      el.innerHTML = '<div class="wd">'+d.short+'</div><div class="dt">'+d.dateLabel.split(" ")[0]+'</div><div class="dot"></div>';
      el.addEventListener("click", function(){
        if (state.date === d.date) return;
        state.date = d.date;
        haptic();
        renderDayTabs();
        renderContent();
      });
      dayTabsEl.appendChild(el);
    });
  }

  function lessonStatus(lesson, isToday, nowMins){
    if (!isToday) return "plain";
    var s = toMinutes(lesson.start), e = toMinutes(lesson.end);
    if (nowMins >= s && nowMins < e) return "current";
    if (nowMins >= e) return "past";
    return "upcoming";
  }

  function renderLessonRow(lesson, status){
    var row = document.createElement("div");
    row.className = "lesson" + (status === "current" ? " current" : "") + (status === "past" ? " past" : "");

    var badge = status === "current" ? '<span class="badge">СЕЙЧАС</span>' : "";
    var place = lesson.room ? ("ауд. " + lesson.room) : (lesson.place ? lesson.place : "");
    var teacherLine = [lesson.teacher, place].filter(Boolean).join(" · ");

    row.innerHTML =
      '<div class="num">'+lesson.num+'</div>'+
      '<div class="body">'+
        '<div class="time">'+lesson.start+'–'+lesson.end+badge+'</div>'+
        '<div class="subj">'+lesson.subject+'</div>'+
        (teacherLine ? '<div class="info">'+teacherLine+'</div>' : '') +
        (lesson.shared ? '<div class="shared">поток вместе с '+lesson.shared+'</div>' : '') +
      '</div>';
    return row;
  }

  function renderContent(){
    var day = SCHEDULE.filter(function(x){ return x.date === state.date; })[0];
    contentEl.innerHTML = "";
    if (!day) return;

    if (day.type === "notice"){
      var n = document.createElement("div");
      n.className = "notice";
      n.innerHTML = '<div class="big">'+day.notice+'</div>' + (day.noticeSub ? '<div class="sub">'+day.noticeSub+'</div>' : '<div class="sub">Занятий по расписанию нет.</div>');
      contentEl.appendChild(n);
      return;
    }

    var lessons = (day.lessons && day.lessons[state.group]) ? day.lessons[state.group] : [];
    var now = nowMoscow();
    var isToday = (day.date === now.dateKey);

    if (!lessons.length){
      var note = document.createElement("div");
      note.className = "empty-note";
      note.textContent = "У группы " + state.group + " в этот день пар нет.";
      contentEl.appendChild(note);
      return;
    }

    // status banner
    if (isToday){
      var current = null, next = null;
      for (var i=0;i<lessons.length;i++){
        var s = toMinutes(lessons[i].start), e = toMinutes(lessons[i].end);
        if (now.mins >= s && now.mins < e) current = lessons[i];
        if (now.mins < s && !next) next = lessons[i];
      }
      var banner = document.createElement("div");
      if (current){
        var s = toMinutes(current.start), e = toMinutes(current.end);
        var pct = Math.max(0, Math.min(100, Math.round((now.mins - s) / (e - s) * 100)));
        var place = current.room ? ("ауд. " + current.room) : (current.place || "");
        banner.className = "status live";
        banner.innerHTML =
          '<div class="tag">СЕЙЧАС ИДЁТ · пара '+current.num+'</div>'+
          '<div class="subj">'+current.subject+'</div>'+
          '<div class="meta">'+[current.teacher, place].filter(Boolean).join(" · ")+' · до '+current.end+'</div>'+
          '<div class="bar"><i style="width:'+pct+'%"></i></div>';
      } else if (next){
        var mins = toMinutes(next.start) - now.mins;
        var untilTxt = mins >= 60 ? (Math.floor(mins/60)+" ч "+(mins%60)+" мин") : (mins+" мин");
        banner.className = "status next";
        banner.innerHTML =
          '<div class="tag">СЛЕДУЮЩАЯ ПАРА · через '+untilTxt+'</div>'+
          '<div class="subj">'+next.subject+'</div>'+
          '<div class="meta">начало в '+next.start+'</div>';
      } else {
        banner.className = "status";
        banner.innerHTML = '<div class="tag" style="color:var(--ink-soft)">НА СЕГОДНЯ ВСЁ</div><div class="subj">Пары для '+state.group+' закончились</div>';
      }
      contentEl.appendChild(banner);
    }

    var tl = document.createElement("div");
    tl.className = "timeline";
    lessons.forEach(function(lesson){
      var status = lessonStatus(lesson, isToday, now.mins);
      tl.appendChild(renderLessonRow(lesson, status));
    });
    contentEl.appendChild(tl);
  }

  function tickClock(){
    var now = nowMoscow();
    var wd = weekdayShortRu(now.dateKey);
    clockEl.textContent = pad(now.hh)+":"+pad(now.mm) + (wd ? (" · "+wd) : "");
  }

  function init(){
    var now = nowMoscow();
    var hasToday = SCHEDULE.some(function(d){ return d.date === now.dateKey; });
    state.date = hasToday ? now.dateKey : SCHEDULE[0].date;

    renderGroupTabs();
    renderDayTabs();
    renderContent();
    tickClock();
    setInterval(function(){
      tickClock();
      renderContent();
    }, 30000);
  }

  loadGroupThenInit();
})();
</script>
</body>
</html>
