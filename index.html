<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Расписание · Калужский филиал РАНХиГС</title>
<meta name="theme-color" content="#0B0D10">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0B0D10;
    --card:#14181E;
    --card-2:#1B212A;
    --ink:#F5F7FA;
    --ink-soft:#A3ACB8;
    --ink-dim:#737C88;
    --hairline:#252B34;
    --gold:#D3A857;
    --gold-dim:#8A7040;
    --gold-wash:rgba(211,168,87,.09);

    --r:12px;
    --font-display:Georgia,'Times New Roman','PT Serif',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;

    /* вертикальный ритм: сжимается на низких экранах */
    --gap:clamp(6px,1.05dvh,11px);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
  }
  body{
    position:fixed; inset:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center;
  }

  .app{
    width:100%;
    max-width:480px;
    height:100%;
    display:flex;
    flex-direction:column;
    gap:var(--gap);
    padding:calc(env(safe-area-inset-top) + 9px) 13px calc(env(safe-area-inset-bottom) + 9px);
  }

  /* ---------- шапка ---------- */
  .hdr{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex:0 0 auto;}
  .hdr .title{display:flex; align-items:center; gap:8px; min-width:0;}
  .infobtn{
    flex:0 0 auto;
    width:clamp(25px,3.35dvh,29px);
    height:clamp(25px,3.35dvh,29px);
    border:1px solid var(--hairline);
    background:var(--card);
    color:var(--ink-dim);
    border-radius:50%;
    font-family:var(--font-display);
    font-size:clamp(14.5px,1.95dvh,16px);
    font-weight:700;
    line-height:1;
    padding:0;
    cursor:pointer;
    transition:color .15s ease,border-color .15s ease;
  }
  .infobtn:hover{color:var(--gold); border-color:var(--gold-dim);}
  .hdr h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(21px,3.05dvh,27px);
    line-height:1.1;
    margin:0;
    letter-spacing:.01em;
  }
  .hdr .meta{text-align:right; line-height:1.25; min-width:0;}
  .hdr .mon{
    font-size:clamp(12.5px,1.7dvh,14.5px);
    color:var(--ink-soft);
    font-weight:600;
    white-space:nowrap;
  }
  .hdr .who{
    font-size:clamp(11.5px,1.55dvh,13px);
    color:var(--ink-dim);
    white-space:nowrap;
  }
  .todaybtn{
    border:0; background:transparent; padding:0;
    color:var(--gold);
    font-family:var(--font-body);
    font-size:clamp(11.5px,1.55dvh,13px);
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }

  /* ---------- группы ---------- */
  .groups{display:flex; gap:6px; flex:0 0 auto;}
  .pill{
    flex:1 1 0;
    min-width:0;
    border:1px solid var(--hairline);
    background:var(--card);
    color:var(--ink-soft);
    padding:clamp(9px,1.45dvh,13px) 4px;
    border-radius:999px;
    font-size:clamp(13px,1.75dvh,15px);
    font-weight:700;
    font-family:var(--font-body);
    white-space:nowrap;
    cursor:pointer;
    transition:background .15s ease,color .15s ease,border-color .15s ease;
  }
  .pill.active{background:var(--ink); border-color:var(--ink); color:var(--bg);}

  /* ---------- недели и дни ---------- */
  .days{display:flex; gap:4px; align-items:stretch; flex:0 0 auto;}
  .daystrip{display:flex; gap:4px; flex:1 1 auto; min-width:0;}
  .wknav{
    flex:0 0 auto;
    width:clamp(25px,7.2vw,31px);
    border:1px solid var(--hairline);
    background:var(--card);
    color:var(--ink-soft);
    border-radius:10px;
    font-family:var(--font-body);
    font-size:clamp(17px,2.3dvh,20px);
    line-height:1;
    cursor:pointer;
    padding:0;
  }
  .wknav:disabled{opacity:.28; cursor:default;}

  .day{
    flex:1 1 0;
    min-width:0;
    text-align:center;
    padding:clamp(6px,1dvh,10px) 2px clamp(6px,.85dvh,9px);
    border-radius:10px;
    border:1px solid transparent;
    background:transparent;
    cursor:pointer;
    font-family:var(--font-body);
    color:var(--ink);
    position:relative;
  }
  .day .wd{font-size:clamp(11.5px,1.5dvh,13px); color:var(--ink-dim); font-weight:600;}
  .day .dt{font-size:clamp(17px,2.3dvh,20px); font-weight:700; line-height:1.15; margin-top:1px;}
  .day.active{background:var(--card-2); border-color:#39414C;}
  .day.today .wd{color:var(--gold);}
  .day.today .dt{color:var(--gold);}
  .day.free .dt{color:var(--ink-dim);}
  .day.today.free .dt{color:var(--gold); opacity:.7;}
  .day.out{opacity:.3;}

  .rule{height:1px; background:var(--hairline); flex:0 0 auto;}

  /* ---------- контент ---------- */
  #content{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:var(--gap);}

  .timeline{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:clamp(5px,.9dvh,10px);
    justify-content:center;   /* остаток высоты делится поровну сверху и снизу */
  }

  .lesson{
    position:relative;
    flex:1 1 auto;      /* высота от содержимого: пара с подгруппами выше обычной */
    min-height:0;
    max-height:clamp(126px,20.5dvh,180px);
    overflow:hidden;
    display:grid;
    grid-template-columns:22px 1fr;
    column-gap:10px;
    align-content:center;
    padding:clamp(7px,1.2dvh,14px) 12px;
    border:1px solid var(--hairline);
    border-radius:var(--r);
    background:var(--card);
  }
  .lesson .num{
    font-family:var(--font-display);
    font-size:clamp(14.5px,1.95dvh,16.5px);
    font-weight:700;
    color:var(--ink-dim);
    text-align:center;
    align-self:start;
    padding-top:1px;
  }
  .lesson .body{min-width:0; display:flex; flex-direction:column; gap:3px;}
  .lesson .top{
    display:flex; align-items:center; gap:8px;
    font-size:clamp(13px,1.7dvh,14.5px);
    color:var(--ink-soft);
    font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .lesson .subj{
    font-size:clamp(15.5px,2.15dvh,18px);
    font-weight:600;
    line-height:1.28;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .lesson .info{
    font-size:clamp(12.5px,1.7dvh,14.5px);
    color:var(--ink-soft);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .lesson .stream{font-size:clamp(12px,1.6dvh,13.5px); color:var(--gold-dim); font-weight:600;}
  .lesson .subs{display:flex; flex-direction:column; gap:1px;}
  .lesson .sgrow{
    font-size:clamp(12px,1.6dvh,13.5px);
    color:var(--ink-soft);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .lesson .sgrow b{color:var(--ink); font-weight:700;}

  /* идёт сейчас */
  .lesson.now{
    background:linear-gradient(180deg,var(--gold-wash),transparent 70%),var(--card-2);
    border-color:var(--gold);
  }
  .lesson.now .num{color:var(--gold);}
  .lesson.now .subj{color:var(--ink);}
  .lesson.now .stream{color:var(--gold);}
  .left{
    margin-left:auto;
    background:var(--gold);
    color:#12140F;
    font-weight:800;
    font-size:clamp(11.5px,1.55dvh,13px);
    letter-spacing:.01em;
    padding:2px 8px;
    border-radius:999px;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .soon{
    margin-left:auto;
    color:var(--gold);
    font-weight:700;
    font-size:clamp(11.5px,1.55dvh,13px);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .progress{
    position:absolute; left:0; right:0; bottom:0;
    height:3px; background:rgba(255,255,255,.07);
  }
  .progress > i{display:block; height:100%; background:var(--gold); transition:width .4s linear;}

  /* прошедшие пары приглушены; сжимаются только если впереди ещё есть занятия */
  .lesson.past{opacity:.5;}
  .timeline.tight .lesson.past{
    flex:0 0 auto;
    max-height:none;
    padding:clamp(5px,.8dvh,9px) 12px;
  }
  .timeline.tight .lesson.past .body{gap:0;}
  .timeline.tight .lesson.past .subj{font-size:clamp(13.5px,1.8dvh,15px); font-weight:500; -webkit-line-clamp:1;}
  .timeline.tight .lesson.past .info,
  .timeline.tight .lesson.past .subs,
  .timeline.tight .lesson.past .stream{display:none;}
  .timeline.tight .lesson.past .top{font-size:clamp(12px,1.55dvh,13px);}

  /* ---------- пустые состояния ---------- */
  .notice{
    flex:0 0 auto;
    margin:auto 0;                    /* карточка по центру свободной высоты */
    display:flex; flex-direction:column; align-items:center;
    gap:8px;
    text-align:center;
    padding:clamp(18px,3dvh,30px) 20px;
    border:1px solid var(--hairline);
    border-radius:var(--r);
    background:var(--card);
  }
  .notice .big{
    font-family:var(--font-display);
    font-size:clamp(20px,2.9dvh,26px);
    font-weight:700;
    line-height:1.25;
  }
  .notice .sub{font-size:clamp(13.5px,1.8dvh,15.5px); color:var(--ink-soft); line-height:1.45; max-width:30ch;}
  .notice.rest{border-style:dashed;}
  .notice.rest .big{color:var(--ink-soft);}
  .notice.event{
    border-color:var(--gold-dim);
    background:linear-gradient(180deg,var(--gold-wash),transparent 70%),var(--card);
  }
  .notice.event .big{color:var(--gold);}
  .notice.holiday{border-style:dashed; border-color:var(--gold-dim);}
  .notice.holiday .big{color:var(--gold);}
  .retry{
    margin-top:4px;
    border:1px solid var(--gold-dim);
    background:transparent;
    color:var(--gold);
    font-family:var(--font-body);
    font-size:clamp(13px,1.7dvh,14.5px);
    font-weight:700;
    padding:7px 16px;
    border-radius:999px;
    cursor:pointer;
  }

  .foot{
    flex:0 0 auto;
    text-align:center;
    margin-top:2px;
    font-size:clamp(12px,1.6dvh,13.5px);
    color:var(--ink-dim);
    padding-top:2px;
  }

  /* ---------- окно «о приложении» ---------- */
  .modal{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    background:rgba(6,8,11,.74);
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  }
  .modal[hidden]{display:none;}      /* display:flex перебивает браузерное [hidden] */
  .sheet{
    width:100%; max-width:330px;
    background:var(--card-2);
    border:1px solid var(--hairline);
    border-radius:16px;
    padding:22px 20px 14px;
    text-align:center;
  }
  .sheet .ttl{
    font-family:var(--font-display);
    font-size:clamp(19px,2.6dvh,22px);
    font-weight:700;
    line-height:1.2;
  }
  .sheet .lbl{
    margin-top:14px;
    font-size:clamp(11.5px,1.5dvh,12.5px);
    color:var(--ink-dim);
    letter-spacing:.04em;
    text-transform:uppercase;
  }
  .sheet .name{
    margin-top:2px;
    font-size:clamp(16px,2.15dvh,18px);
    font-weight:700;
  }
  .sheet .note{
    margin-top:14px;
    font-size:clamp(13.5px,1.8dvh,15px);
    color:var(--ink-soft);
    line-height:1.45;
  }
  .tglink{
    display:inline-block;
    margin-top:16px;
    padding:10px 20px;
    border-radius:999px;
    background:var(--gold);
    color:#12140F;
    font-size:clamp(14px,1.9dvh,15.5px);
    font-weight:800;
    text-decoration:none;
    cursor:pointer;
  }
  .sheet .close{
    display:block;
    width:100%;
    margin-top:6px;
    padding:10px 0 2px;
    border:0; background:transparent;
    color:var(--ink-dim);
    font-family:var(--font-body);
    font-size:clamp(13px,1.7dvh,14px);
    font-weight:600;
    cursor:pointer;
  }

  button{font:inherit;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }

  /* очень низкие экраны (iPhone SE и подобные): ужимаем воздух, но не шрифты */
  @media (max-height:600px){
    .app{padding-left:11px; padding-right:11px;}
    .lesson{padding:5px 10px;}
    .lesson .body{gap:2px;}
    .lesson .subs{gap:0;}
    .notice{padding-top:14px; padding-bottom:14px;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="hdr">
    <div class="title">
      <h1>Расписание</h1>
      <button class="infobtn" type="button" id="aboutBtn" aria-label="Об авторе и обратной связи">i</button>
    </div>
    <div class="meta">
      <div class="mon" id="monthLabel">&nbsp;</div>
      <div class="who" id="whoLine">&nbsp;</div>
    </div>
  </header>

  <div class="groups" id="groupTabs"></div>
  <div class="days">
    <button class="wknav" type="button" id="prevWk" aria-label="Предыдущая неделя">‹</button>
    <div class="daystrip" id="dayTabs"></div>
    <button class="wknav" type="button" id="nextWk" aria-label="Следующая неделя">›</button>
  </div>
  <div class="rule"></div>
  <main id="content"></main>

</div>

<div class="modal" id="aboutModal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="О приложении">
    <div class="ttl">О приложении</div>
    <div class="lbl">Автор</div>
    <div class="name">Никита Кузин</div>
    <div class="note">Нашли ошибку в расписании или есть идея, что улучшить, — напишите.</div>
    <a class="tglink" id="tgLink" href="https://t.me/plaguedoc000" target="_blank" rel="noopener">@plaguedoc000</a>
    <button class="close" type="button" id="aboutClose">Закрыть</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var DATA_URL  = "schedule.json";
  var CACHE_KEY = "schedule_cache_v1";

  var MONTH_GEN = ["января","февраля","марта","апреля","мая","июня",
                   "июля","августа","сентября","октября","ноября","декабря"];
  var MONTH_NOM = ["Январь","Февраль","Март","Апрель","Май","Июнь",
                   "Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
  var WD_SHORT  = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
  var WD_FULL   = ["понедельник","вторник","среда","четверг","пятница","суббота","воскресенье"];

  // ---------- состояние ----------
  var DATA   = null;
  var state  = { group:null, date:null, week:null, pinned:false };
  var lastSig = null;
  var lastDateKey = null;
  var timer = null;
  var started = false;

  // ---------- Telegram ----------
  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

  function tgCall(name){
    if (!tg || typeof tg[name] !== "function") return false;
    try{ tg[name].apply(tg, [].slice.call(arguments,1)); return true; }catch(e){ return false; }
  }
  function haptic(){
    if (tg && tg.HapticFeedback){
      try{ tg.HapticFeedback.selectionChanged(); }catch(e){}
    }
  }

  if (tg){
    tgCall("ready");
    tgCall("expand");
    tgCall("disableVerticalSwipes");     // не даём приложению схлопываться свайпом
    tgCall("setHeaderColor","#0B0D10");
    tgCall("setBackgroundColor","#0B0D10");
  }

  // ---------- даты (UTC, чтобы часовой пояс не сдвигал сутки) ----------
  function parseKey(k){
    var p = String(k).split("-");
    return Date.UTC(+p[0], (+p[1])-1, +p[2]);
  }
  function keyOf(ms){
    var d = new Date(ms), m = d.getUTCMonth()+1, day = d.getUTCDate();
    return d.getUTCFullYear() + "-" + (m<10?"0":"") + m + "-" + (day<10?"0":"") + day;
  }
  function addDays(k, n){ return keyOf(parseKey(k) + n*86400000); }
  function isoWeekday(k){ var d = new Date(parseKey(k)).getUTCDay(); return d === 0 ? 7 : d; }
  function mondayOf(k){ return addDays(k, 1 - isoWeekday(k)); }
  function dayNum(k){ return new Date(parseKey(k)).getUTCDate(); }
  function monthOf(k){ return new Date(parseKey(k)).getUTCMonth(); }
  function yearOf(k){ return new Date(parseKey(k)).getUTCFullYear(); }
  function dateLabel(k){ return dayNum(k) + " " + MONTH_GEN[monthOf(k)]; }

  // ---------- время (Europe/Moscow) ----------
  var mskFmt = new Intl.DateTimeFormat("en-CA",{
    timeZone:"Europe/Moscow", year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false
  });
  function nowMoscow(){
    var map = {};
    mskFmt.formatToParts(new Date()).forEach(function(p){ map[p.type] = p.value; });
    var h = +map.hour % 24;                       // защита от "24:00" в некоторых движках
    var sec = h*3600 + (+map.minute)*60 + (+map.second);
    return { dateKey:map.year+"-"+map.month+"-"+map.day, sec:sec, mins:Math.floor(sec/60) };
  }
  function toMinutes(hhmm){
    var p = String(hhmm).split(":");
    return (+p[0])*60 + (+p[1]);
  }
  function fmtDuration(sec){
    var m = Math.max(0, Math.ceil(sec/60));
    if (m < 60) return m + " мин";
    var h = Math.floor(m/60), r = m % 60;
    return r ? (h + " ч " + r + " мин") : (h + " ч");
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
    });
  }

  // ---------- узлы ----------
  var groupTabsEl = document.getElementById("groupTabs");
  var dayTabsEl   = document.getElementById("dayTabs");
  var contentEl   = document.getElementById("content");
  var monthEl     = document.getElementById("monthLabel");
  var whoEl       = document.getElementById("whoLine");
  var prevWkEl    = document.getElementById("prevWk");
  var nextWkEl    = document.getElementById("nextWk");

  // ---------- разбор дня ----------
  // приоритет: конкретная дата -> праздник -> каникулы/сессия -> недельный шаблон
  function resolveDay(k){
    if (!DATA) return { kind:"unknown" };
    var meta = DATA.meta || {};
    if (meta.yearStart && k < meta.yearStart) return { kind:"outside", why:"before" };
    if (meta.yearEnd   && k > meta.yearEnd)   return { kind:"outside", why:"after"  };

    var explicit = DATA.days && DATA.days[k];
    if (explicit) return fromEntry(explicit, false);

    var hol = DATA.holidays && DATA.holidays[k];
    if (hol){                                  // строка — просто название, объект — с подписью
      var isStr = (typeof hol === "string");
      return { kind:"notice",
               title: isStr ? hol : hol.title,
               sub:   (isStr ? null : hol.sub) || "Нерабочий праздничный день.",
               tone:"holiday" };
    }

    var br = findBreak(k);
    if (br) return { kind:"notice", title:br.title, sub:br.sub || "Занятий нет.", tone:"rest" };

    var pat = DATA.pattern && DATA.pattern[String(isoWeekday(k))];
    if (pat) return fromEntry(pat, true);

    return { kind:"unknown" };
  }
  function fromEntry(entry, fromPattern){
    if (entry.notice){
      return { kind:"notice", title:entry.notice.title, sub:entry.notice.sub,
               tone:entry.notice.tone || "rest", pattern:fromPattern };
    }
    if (entry.lessons) return { kind:"lessons", lessons:entry.lessons, pattern:fromPattern };
    return { kind:"unknown" };
  }
  function findBreak(k){
    var list = (DATA && DATA.breaks) || [];
    for (var i=0;i<list.length;i++){
      if (list[i] && k >= list[i].from && k <= list[i].to) return list[i];
    }
    return null;
  }
  function lessonsOf(day, group){
    if (!day || day.kind !== "lessons" || !day.lessons) return [];
    return day.lessons[group] || [];
  }
  // ---------- границы учебного года ----------
  function weekMin(){ return mondayOf((DATA.meta && DATA.meta.yearStart) || "2026-09-01"); }
  function weekMax(){ return mondayOf((DATA.meta && DATA.meta.yearEnd)   || "2027-06-30"); }
  function clampDate(k){
    var meta = DATA.meta || {};
    if (meta.yearStart && k < meta.yearStart) return meta.yearStart;
    if (meta.yearEnd   && k > meta.yearEnd)   return meta.yearEnd;
    return k;
  }
  function pickInitialDate(todayKey){
    var k = clampDate(todayKey);
    if (isoWeekday(k) === 7) k = addDays(k, 1);        // воскресенья в сетке нет
    return clampDate(k);
  }

  // ---------- шапка ----------
  function renderHeader(){
    var meta = DATA.meta || {};
    monthEl.textContent = MONTH_NOM[monthOf(state.date)] + " " + yearOf(state.date);

    var todayKey = nowMoscow().dateKey;
    if (state.date !== todayKey && todayKey >= meta.yearStart && todayKey <= meta.yearEnd){
      whoEl.innerHTML = '<button type="button" class="todaybtn" id="todayBtn">← сегодня</button>';
      document.getElementById("todayBtn").addEventListener("click", function(){
        goToDate(pickInitialDate(nowMoscow().dateKey));
      });
    } else {
      whoEl.textContent = [meta.org, meta.course].filter(Boolean).join(" · ");
    }
  }

  // ---------- вкладки групп ----------
  function renderGroupTabs(){
    groupTabsEl.innerHTML = "";
    (DATA.groups || []).forEach(function(g){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "pill" + (g === state.group ? " active" : "");
      btn.textContent = g;
      btn.setAttribute("aria-pressed", g === state.group ? "true" : "false");
      btn.addEventListener("click", function(){
        if (state.group === g) return;
        state.group = g;
        saveGroup(g);
        haptic();
        renderGroupTabs();
        renderDayTabs();
        render(true);
      });
      groupTabsEl.appendChild(btn);
    });
  }

  // ---------- неделя и дни ----------
  function renderDayTabs(){
    var todayKey = nowMoscow().dateKey;
    dayTabsEl.innerHTML = "";

    for (var i=0;i<6;i++){                       // понедельник … суббота
      var k = addDays(state.week, i);
      var day = resolveDay(k);
      var outside = (day.kind === "outside");
      var free = outside || day.kind === "notice" || day.kind === "unknown"
                 || !lessonsOf(day, state.group).length;

      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "day"
        + (k === state.date ? " active" : "")
        + (k === todayKey ? " today" : "")
        + (free ? " free" : "")
        + (outside ? " out" : "");
      btn.setAttribute("aria-pressed", k === state.date ? "true" : "false");
      btn.setAttribute("aria-label", WD_FULL[i] + ", " + dateLabel(k));
      btn.innerHTML = '<div class="wd">'+WD_SHORT[i]+'</div><div class="dt">'+dayNum(k)+'</div>';
      (function(key){
        btn.addEventListener("click", function(){
          if (state.date === key) return;
          goToDate(key);
        });
      })(k);
      dayTabsEl.appendChild(btn);
    }

    prevWkEl.disabled = (state.week <= weekMin());
    nextWkEl.disabled = (state.week >= weekMax());
  }

  function goToDate(k){
    state.date = k;
    state.week = mondayOf(k);
    state.pinned = (k !== nowMoscow().dateKey);
    haptic();
    renderHeader();
    renderDayTabs();
    render(true);
  }
  function shiftWeek(dir){
    var target = addDays(state.week, dir*7);
    if (target < weekMin() || target > weekMax()) return;
    var offset = Math.min(5, Math.max(0, isoWeekday(state.date) - 1));
    state.week = target;
    goToDate(clampDate(addDays(target, offset)));   // не выпадаем за границы года
  }
  function shiftDay(dir){
    var k = addDays(state.date, dir);
    if (isoWeekday(k) === 7) k = addDays(k, dir);      // перепрыгиваем воскресенье
    var meta = DATA.meta || {};
    if (k < meta.yearStart || k > meta.yearEnd) return;
    goToDate(k);
  }

  // ---------- статусы ----------
  function lessonStatus(lesson, isToday, nowMins){
    if (!isToday) return "plain";
    var s = toMinutes(lesson.start), e = toMinutes(lesson.end);
    if (nowMins >= e) return "past";
    if (nowMins >= s) return "now";
    return "next";
  }

  function signature(now){
    var day = resolveDay(state.date);
    if (day.kind !== "lessons") return state.date + "|" + day.kind + "|" + (day.title || "");
    var isToday = (state.date === now.dateKey);
    var list = lessonsOf(day, state.group);
    if (!list.length) return state.date + "|" + state.group + "|empty";
    var st = list.map(function(l){ return lessonStatus(l, isToday, now.mins).charAt(0); }).join("");
    return state.date + "|" + state.group + "|" + (isToday ? "T" : "F") + "|" + st;
  }

  // ---------- карточка пары ----------
  function lessonCard(lesson, status, isFirstUpcoming, now){
    var el = document.createElement("div");
    el.className = "lesson" + (status === "now" ? " now" : "") + (status === "past" ? " past" : "");

    var place = lesson.room ? ("ауд. " + lesson.room) : (lesson.place || "");
    var info = [lesson.teacher, place, lesson.note].filter(Boolean).join(" · ");
    var title = lesson.brief || lesson.subject;

    // подгруппы: номер и аудитория идут первыми, чтобы при обрезке
    // терялась фамилия, а не то, куда идти
    var subs = "";
    if (lesson.subgroups && lesson.subgroups.length){
      subs = '<div class="subs">' + lesson.subgroups.map(function(sg){
        var sp = sg.room ? ("ауд. " + sg.room) : (sg.place || "");
        return '<div class="sgrow"><b>' + esc(sg.label) + '</b>'
             + (sp ? ' · ' + esc(sp) : '')
             + (sg.teacher ? ' · ' + esc(sg.teacher) : '') + '</div>';
      }).join("") + '</div>';
    }

    var right = "";
    if (status === "now"){
      right = '<span class="left" id="leftTxt">' + esc(leftText(lesson, now)) + '</span>';
    } else if (status === "next" && isFirstUpcoming){
      right = '<span class="soon" id="soonTxt">' + esc(soonText(lesson, now)) + '</span>';
    }

    el.innerHTML =
      '<div class="num">'+esc(lesson.num)+'</div>'+
      '<div class="body">'+
        '<div class="top"><span>'+esc(lesson.start)+' – '+esc(lesson.end)+'</span>'+right+'</div>'+
        '<div class="subj" title="'+esc(lesson.subject)+'">'+esc(title)+'</div>'+
        (info ? '<div class="info">'+esc(info)+'</div>' : '') +
        subs +
        (lesson.shared ? '<div class="stream">поток с '+esc(lesson.shared)+'</div>' : '')+
      '</div>';

    if (status === "now"){
      var bar = document.createElement("div");
      bar.className = "progress";
      bar.innerHTML = '<i id="liveBar" style="width:'+progressPct(lesson, now)+'%"></i>';
      el.appendChild(bar);
    }
    return el;
  }

  function leftText(lesson, now){
    var rest = toMinutes(lesson.end)*60 - now.sec;
    if (rest <= 60) return "меньше минуты";
    return "осталось " + fmtDuration(rest);
  }
  function soonText(lesson, now){
    var wait = toMinutes(lesson.start)*60 - now.sec;
    if (wait <= 60) return "вот-вот";
    return "через " + fmtDuration(wait);
  }
  function progressPct(lesson, now){
    var s = toMinutes(lesson.start)*60, e = toMinutes(lesson.end)*60;
    if (e <= s) return 100;                                   // защита от деления на ноль
    return Math.max(0, Math.min(100, ((now.sec - s) / (e - s)) * 100)).toFixed(1);
  }

  // ---------- основной рендер ----------
  function render(force){
    var now = nowMoscow();
    var sig = signature(now);
    if (!force && sig === lastSig){ softUpdate(now); return; }
    lastSig = sig;

    contentEl.innerHTML = "";
    var day = resolveDay(state.date);

    if (day.kind === "outside"){
      contentEl.appendChild(noticeBlock(
        day.why === "after" ? "Учебный год завершён" : "Учебный год ещё не начался",
        "Расписание ведётся с " + dateLabel(DATA.meta.yearStart) + " по " + dateLabel(DATA.meta.yearEnd) + ".",
        "rest"));
      return;
    }
    if (day.kind === "unknown"){
      contentEl.appendChild(noticeBlock("Расписание не заполнено",
        WD_FULL[isoWeekday(state.date)-1].replace(/^./, function(c){ return c.toUpperCase(); })
        + ", " + dateLabel(state.date) + ". Данных на этот день пока нет.", "rest"));
      return;
    }
    if (day.kind === "notice"){
      contentEl.appendChild(noticeBlock(day.title, day.sub || "Занятий по расписанию нет.", day.tone));
      return;
    }

    var list = lessonsOf(day, state.group);
    var isToday = (state.date === now.dateKey);

    if (!list.length){
      contentEl.appendChild(noticeBlock("Пар нет",
        "У группы " + state.group + " в этот день занятий не запланировано.", "rest"));
      return;
    }

    var tl = document.createElement("div");
    tl.className = "timeline";

    var upcomingUsed = false, anyNow = false, anyLeft = false;
    list.forEach(function(lesson){
      var st = lessonStatus(lesson, isToday, now.mins);
      var first = false;
      if (st === "now") anyNow = true;
      if (st === "next"){
        anyLeft = true;
        if (!upcomingUsed){ first = true; upcomingUsed = true; }
      }
      tl.appendChild(lessonCard(lesson, st, first, now));
    });
    if (isToday && (anyNow || anyLeft)) tl.className += " tight";

    if (isToday && !anyNow && !anyLeft){
      var f = document.createElement("div");
      f.className = "foot";
      f.textContent = "Пары на сегодня закончились";
      tl.appendChild(f);
    }
    contentEl.appendChild(tl);
  }

  function noticeBlock(big, sub, tone){
    var n = document.createElement("div");
    n.className = "notice " + (tone === "event" ? "event" : tone === "holiday" ? "holiday" : "rest");
    n.innerHTML = '<div class="big">'+esc(big)+'</div><div class="sub">'+esc(sub)+'</div>';
    return n;
  }

  // обновляем только цифры, не пересобирая DOM
  function softUpdate(now){
    var day = resolveDay(state.date);
    if (day.kind !== "lessons") return;
    if (state.date !== now.dateKey) return;

    var list = lessonsOf(day, state.group);
    var leftEl = document.getElementById("leftTxt");
    var barEl  = document.getElementById("liveBar");
    var soonEl = document.getElementById("soonTxt");
    var upcomingUsed = false;

    list.forEach(function(l){
      var st = lessonStatus(l, true, now.mins);
      if (st === "now"){
        if (leftEl) leftEl.textContent = leftText(l, now);
        if (barEl)  barEl.style.width = progressPct(l, now) + "%";
      } else if (st === "next" && !upcomingUsed){
        upcomingUsed = true;
        if (soonEl) soonEl.textContent = soonText(l, now);
      }
    });
  }

  // ---------- смена суток / пересчёт ----------
  function tick(){
    var now = nowMoscow();
    if (now.dateKey !== lastDateKey){
      lastDateKey = now.dateKey;
      if (!state.pinned){
        state.date = pickInitialDate(now.dateKey);
        state.week = mondayOf(state.date);
      }
      renderHeader();
      renderDayTabs();
      render(true);
      return;
    }
    render(false);
  }

  // ---------- свайп по дням ----------
  function bindSwipe(){
    var x0 = 0, y0 = 0, active = false;
    contentEl.addEventListener("touchstart", function(ev){
      if (ev.touches.length !== 1) { active = false; return; }
      x0 = ev.touches[0].clientX; y0 = ev.touches[0].clientY; active = true;
    }, {passive:true});
    contentEl.addEventListener("touchend", function(ev){
      if (!active) return;
      active = false;
      var t = ev.changedTouches[0];
      var dx = t.clientX - x0, dy = t.clientY - y0;
      if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
      shiftDay(dx < 0 ? 1 : -1);
    }, {passive:true});
  }

  // ---------- хранилище выбранной группы ----------
  function saveGroup(g){
    try{ localStorage.setItem("selected_group", g); }catch(e){}
    if (tg && tg.CloudStorage && tg.CloudStorage.setItem){
      try{ tg.CloudStorage.setItem("selected_group", g, function(){}); }catch(e){}
    }
  }
  function storedGroup(){
    var v = null;
    try{ v = localStorage.getItem("selected_group"); }catch(e){}
    return v;
  }

  // ---------- загрузка данных ----------
  function getJSON(url, ok, fail){
    try{
      var x = new XMLHttpRequest();
      x.open("GET", url, true);
      x.onreadystatechange = function(){
        if (x.readyState !== 4) return;
        if (x.status >= 200 && x.status < 300){
          var parsed = null;
          try{ parsed = JSON.parse(x.responseText); }catch(e){ fail(); return; }
          ok(parsed);
        } else fail();
      };
      x.onerror = function(){ fail(); };
      x.send();
    }catch(e){ fail(); }
  }
  function valid(json){
    return !!(json && json.meta && json.meta.yearStart && json.meta.yearEnd
              && json.groups && json.groups.length);
  }

  function loadData(){
    var cachedRaw = null;
    try{ cachedRaw = localStorage.getItem(CACHE_KEY); }catch(e){}
    if (cachedRaw){
      var cached = null;
      try{ cached = JSON.parse(cachedRaw); }catch(e){}
      if (valid(cached)){ DATA = cached; boot(); }     // мгновенный старт из кэша
    }

    getJSON(DATA_URL + "?t=" + Date.now(), function(json){
      if (!valid(json)){ if (!DATA) showFatal(); return; }
      var fresh = JSON.stringify(json);
      if (DATA && fresh === JSON.stringify(DATA)) return;   // ничего не поменялось
      try{ localStorage.setItem(CACHE_KEY, fresh); }catch(e){}
      DATA = json;
      if (!started) boot(); else reboot();
    }, function(){
      if (!DATA) showFatal();
    });
  }

  function showFatal(){
    contentEl.innerHTML = "";
    var n = noticeBlock("Расписание недоступно",
      "Не удалось загрузить schedule.json. Проверьте соединение и попробуйте ещё раз.", "rest");
    var b = document.createElement("button");
    b.type = "button"; b.className = "retry"; b.textContent = "Повторить";
    b.addEventListener("click", function(){ contentEl.innerHTML = ""; loadData(); });
    n.appendChild(b);
    contentEl.appendChild(n);
  }

  // ---------- окно «о приложении» ----------
  function bindAbout(){
    var modal = document.getElementById("aboutModal");
    var open  = document.getElementById("aboutBtn");
    var close = document.getElementById("aboutClose");
    var link  = document.getElementById("tgLink");

    function show(){ modal.hidden = false; haptic(); }
    function hide(){ modal.hidden = true; }

    open.addEventListener("click", show);
    close.addEventListener("click", hide);
    modal.addEventListener("click", function(ev){
      if (ev.target === modal) hide();          // клик по затемнению
    });
    document.addEventListener("keydown", function(ev){
      if (ev.key === "Escape" && !modal.hidden) hide();
    });
    link.addEventListener("click", function(ev){
      // внутри Telegram обычная ссылка не открывается — просим клиент сам.
      // в обычном браузере метод тоже есть, но молча ничего не делает,
      // поэтому сначала убеждаемся, что мы правда внутри клиента
      var inTelegram = !!(tg && tg.platform && tg.platform !== "unknown");
      if (inTelegram && tgCall("openTelegramLink", "https://t.me/plaguedoc000")){
        ev.preventDefault();
        hide();
      }
    });
  }

  // ---------- запуск ----------
  function pickGroup(){
    var groups = DATA.groups || [];
    var saved = storedGroup();
    return (saved && groups.indexOf(saved) !== -1) ? saved : groups[0];
  }

  function boot(){
    if (started) return;
    started = true;

    state.group = pickGroup();
    var now = nowMoscow();
    lastDateKey = now.dateKey;
    state.date  = pickInitialDate(now.dateKey);
    state.week  = mondayOf(state.date);
    state.pinned = false;

    prevWkEl.addEventListener("click", function(){ shiftWeek(-1); });
    nextWkEl.addEventListener("click", function(){ shiftWeek(1); });

    renderHeader();
    renderGroupTabs();
    renderDayTabs();
    render(true);
    bindSwipe();
    bindAbout();

    if (timer) clearInterval(timer);
    timer = setInterval(tick, 10000);

    document.addEventListener("visibilitychange", function(){
      if (!document.hidden) tick();     // мгновенно освежаем после сворачивания
    });

    // группа могла быть выбрана на другом устройстве
    if (tg && tg.CloudStorage && tg.CloudStorage.getItem){
      try{
        tg.CloudStorage.getItem("selected_group", function(err, val){
          if (err || !val || !DATA) return;
          if ((DATA.groups || []).indexOf(val) === -1 || val === state.group) return;
          state.group = val;
          try{ localStorage.setItem("selected_group", val); }catch(e){}
          renderGroupTabs();
          renderDayTabs();
          render(true);
        });
      }catch(e){}
    }
  }

  // данные обновились по сети — пересобираем, сохраняя выбор пользователя
  function reboot(){
    if ((DATA.groups || []).indexOf(state.group) === -1) state.group = pickGroup();
    state.date = clampDate(state.date);
    state.week = mondayOf(state.date);
    lastSig = null;
    renderHeader();
    renderGroupTabs();
    renderDayTabs();
    render(true);
  }

  loadData();
})();
</script>
</body>
</html>
